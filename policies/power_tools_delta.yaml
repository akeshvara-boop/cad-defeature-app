policy:
  id: power_tools_delta
  version: "0.1"
  status: draft
  description: >-
    Conservative, auditable configuration for future defeaturing operations.
    All geometry-changing rules are disabled until a CAD kernel and validation
    workflow are implemented.

rules:
  remove_holes:
    enabled: false
    max_diameter_mm: null
  remove_fillets:
    enabled: false
    max_radius_mm: null
  remove_chamfers:
    enabled: false
    max_length_mm: null

verification:
  require_valid_brep: true
  require_solid_count_preserved: true
  require_nonempty_output: true
  require_change_report: true
